version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: tontiflow-postgres
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: postgres
      POSTGRES_MULTIPLE_DATABASES: user_db,tontine_db,financial_db,credit_db,notification_db,authentication_db,config_db,discovery_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-multiple-databases.sh:/docker-entrypoint-initdb.d/init-multiple-databases.sh

volumes:
  postgres_data: