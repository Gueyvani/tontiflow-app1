server:
  port: 8083

spring:
  application:
    name: financial-service
  datasource:
    url: jdbc:postgresql://localhost:5433/financial_db
    username: postgres
    # Decision R11 (corrections techniques) : aucune valeur par defaut - un
    # mot de passe par defaut faible (root) demarrerait silencieusement en
    # production si la variable n'etait pas positionnee. Absence de variable
    # = echec explicite au demarrage, meme discipline que JWT_PUBLIC_KEY_PATH
    # ci-dessous. Le profil de test (application-test.yml) ne depend jamais
    # de cette variable : il remplace entierement ce bloc datasource par H2.
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

# Securite JWT (RS256) : verification locale uniquement, aucune cle privee.
# Emplacement externalise via variable d'environnement - aucune valeur par
# defaut, aucune cle committee. Absence de variable = echec explicite au demarrage.
# Secret partage des jetons de service (decision F-8) : authentifie tontine-service, seul
# appelant des endpoints /internal/**. Aucune valeur par defaut : demarrage en echec s'il est
# absent ou de moins de 32 octets. Ne jamais journaliser ni versionner de valeur reelle.
internal-service-token:
  secret: ${INTERNAL_SERVICE_TOKEN_SECRET}

# Actuator limite au strict necessaire pour permettre une sonde de sante sans
# JWT (orchestration - Docker/K8s) sans exposer d'informations sensibles
# (decision R11, corrections techniques - meme pattern deja etabli par
# config-service). env/beans/configprops/mappings/heapdump/shutdown restent
# desactives (non inclus). SecurityConfig autorise explicitement /actuator/health
# en lecture anonyme ; tout le reste de /actuator/** reste soumis a
# anyRequest().authenticated().
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never