spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
  security:
    user:
      name: test
      password: test
  flyway:
    enabled: false

# Rate limiting du claim neutralise par defaut sous le profil test : les
# suites existantes (MemberInvitationControllerIntegrationTest, ...) emettent
# de nombreuses requetes depuis 127.0.0.1 et ne doivent pas etre limitees.
# Les tests dedies (ClaimRateLimitFilterTest, ClaimRateLimitIntegrationTest)
# fixent explicitement des seuils bas.
claim-rate-limit:
  ip-per-minute: 1000000
  account-per-minute: 1000000