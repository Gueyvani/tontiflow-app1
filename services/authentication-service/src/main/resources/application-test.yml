spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
  security:
    user:
      name: test
      password: test
  flyway:
    enabled: false

# Purge des Refresh Tokens (decision F-2) desactivee par defaut sous le profil test : la planification
# n'a pas a s'executer pendant les suites ; les tests appellent RefreshTokenPurgeService directement.
refresh-token:
  purge:
    enabled: false
