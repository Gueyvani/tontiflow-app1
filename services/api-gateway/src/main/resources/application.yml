server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: user-service
          uri: ${USER_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/users/**
        - id: tontine-service
          uri: ${TONTINE_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/tontines/**
        - id: financial-service
          uri: ${FINANCIAL_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/v1/financials/**
        - id: credit-service
          uri: ${CREDIT_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/api/v1/credits/**
        - id: notification-service
          uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8085}
          predicates:
            - Path=/api/v1/notifications/**
        - id: authentication-service
          uri: ${AUTHENTICATION_SERVICE_URL:http://localhost:8086}
          predicates:
            - Path=/api/v1/auth/**,/api/v1/admin/**

jwt:
  public-key-location: ${JWT_PUBLIC_KEY_PATH}

# Rate limiting IP local (in-JVM) de POST /api/v1/tontines/{tontineId}/members/claim
# (decision R21-C.A3.2, option O-B). La dimension "par IP" est portee ici, au
# point d'entree, ou l'adresse est celle du pair TCP reel ; la dimension "par
# compte" (5/min) reste dans tontine-service. Fenetre glissante d'une minute,
# NON distribue (compteurs par instance de Gateway, remis a zero au redemarrage).
# trusted-proxy-count : 0 = X-Forwarded-For ignore (pair TCP uniquement, defaut
# sur). Ne passer a > 0 que si un reverse proxy de confiance est place devant le
# Gateway - valeur = nombre exact de proxies de confiance. Jamais de confiance
# aveugle en X-Forwarded-For.
claim-ip-rate-limit:
  enabled: ${CLAIM_IP_RATE_LIMIT_ENABLED:true}
  ip-per-minute: ${CLAIM_IP_RATE_LIMIT_IP_PER_MINUTE:10}
  trusted-proxy-count: ${CLAIM_IP_RATE_LIMIT_TRUSTED_PROXY_COUNT:0}

# Rate limiting IP local (in-JVM) de POST /api/v1/auth/login (decision R21-D.1,
# option 3 phase 3a). Ferme le vecteur de force brute / credential-stuffing
# mono-source sur le login (constat N1, R21-C.A3.3) : cet endpoint est public
# et n'etait rate-limite nulle part. La protection PAR COMPTE (verrouillage
# temporise) est prevue pour une phase ulterieure (R21-D.3). Fenetre glissante
# d'une minute, NON distribue (compteurs par instance, remis a zero au
# redemarrage). Meme semantique trusted-proxy-count que claim-ip-rate-limit :
# 0 = X-Forwarded-For ignore (pair TCP uniquement, defaut sur).
auth-ip-rate-limit:
  enabled: ${AUTH_IP_RATE_LIMIT_ENABLED:true}
  login-per-minute: ${AUTH_IP_RATE_LIMIT_LOGIN_PER_MINUTE:5}
  trusted-proxy-count: ${AUTH_IP_RATE_LIMIT_TRUSTED_PROXY_COUNT:0}

# Rate limiting IP local (in-JVM) de POST /api/v1/auth/refresh (decision
# R21-D.7, Phase B - constat D4-03/R21-D.4). Cet endpoint est public (permitAll)
# et n'etait rate-limite nulle part. L'IP est la seule dimension exploitable au
# Gateway ici : le refresh token brut n'est ni decodable ni resolvable en
# accountId sans dupliquer RefreshTokenRepository au Gateway. Limite
# volontairement plus haute que auth-ip-rate-limit.login-per-minute : /refresh
# est appele automatiquement (renouvellement de session), a un rythme
# structurellement plus eleve qu'un login humain ponctuel. Fenetre glissante
# d'une minute, NON distribue (compteurs par instance, remis a zero au
# redemarrage). Meme semantique trusted-proxy-count que les deux filtres
# ci-dessus : 0 = X-Forwarded-For ignore (pair TCP uniquement, defaut sur).
refresh-ip-rate-limit:
  enabled: ${REFRESH_IP_RATE_LIMIT_ENABLED:true}
  refresh-per-minute: ${REFRESH_IP_RATE_LIMIT_REFRESH_PER_MINUTE:30}
  trusted-proxy-count: ${REFRESH_IP_RATE_LIMIT_TRUSTED_PROXY_COUNT:0}

# Actuator limite au strict necessaire pour permettre une sonde de sante sans
# JWT (orchestration - Docker/K8s) sans exposer d'informations sensibles
# (decision R11, corrections techniques - meme pattern deja etabli par
# config-service). env/beans/configprops/mappings/heapdump/shutdown restent
# desactives (non inclus). SecurityConfig autorise explicitement /actuator/health
# en lecture anonyme ; tout le reste de /actuator/** reste soumis a
# anyExchange().authenticated().
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never