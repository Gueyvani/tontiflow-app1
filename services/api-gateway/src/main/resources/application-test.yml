spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
  security:
    user:
      name: test
      password: test
  flyway:
    enabled: false

# Rate limiting IP du claim neutralise par defaut sous le profil test : les
# suites existantes emettent de nombreuses requetes depuis 127.0.0.1 et ne
# doivent pas etre limitees. Le test dedie (ClaimIpRateLimitIntegrationTest)
# fixe explicitement un seuil bas via @SpringBootTest properties.
claim-ip-rate-limit:
  ip-per-minute: 1000000